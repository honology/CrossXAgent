name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build · test · clippy · fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # aws-lc-sys (rustls), zstd-sys, and the OTLP stack compile C/C++ from
      # source; the toolchain is not fully present on the runner by default.
      - name: Install C build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang build-essential pkg-config

      # rust-toolchain.toml pins the channel; this installs it plus components.
      - name: Rust toolchain + components
        run: rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
